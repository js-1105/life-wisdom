<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>終極關懷 · 牆或門匿名投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<script src="fbconfig.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--c:#2E6B5A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC","PingFang TC",sans-serif;background:#F4F7F2;color:#1C2721;line-height:1.6;padding:env(safe-area-inset-top) 0 2em}
.bar{background:var(--c);color:#fff;padding:1.2em 1.1em;position:sticky;top:0;z-index:10;box-shadow:0 3px 14px rgba(0,0,0,.18)}
.bar .g{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.55rem;letter-spacing:.03em}
.bar .s{font-size:.88rem;opacity:.92;margin-top:.15em}
.wrap{max-width:640px;margin:0 auto;padding:1.1em 1.1em}
.blk{background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(46,107,90,.08);border-top:5px solid var(--c);padding:1.1em 1.1em 1.2em}
.q{font-family:"Noto Serif TC",serif;font-weight:700;font-size:1.25rem;line-height:1.5;margin-bottom:.8em}
.opts{display:flex;flex-direction:column;gap:.7em}
.opts button{display:flex;flex-direction:column;align-items:flex-start;padding:.85em 1em;border:2px solid #CBD9D0;background:#fff;border-radius:14px;font-family:inherit;cursor:pointer;text-align:left}
.opts button b{font-family:"Noto Serif TC",serif;font-size:1.35rem;color:#1C2721}
.opts button span{font-size:.95rem;color:#5C6C62}
.opts button.on{background:var(--c);border-color:var(--c)}
.opts button.on b,.opts button.on span{color:#fff}
.foot{text-align:center;color:#5C6C62;font-size:.85rem;margin-top:.9em;padding:0 1em}
.msg{margin-top:.9em;font-size:1rem;color:#2E6B5A;font-weight:700;min-height:1.6em}
</style>
</head>
<body>
<div class="bar"><div class="g">牆，還是門？</div><div class="s">匿名投票——沒有人會知道是誰投的</div></div>
<div class="wrap">
  <section class="blk">
    <p class="q">死，對你而言比較像一堵牆還是一扇門？</p>
    <div class="opts" id="opts">
      <button data-v="wall"><b>牆</b><span>走到盡頭即虛無</span></button>
      <button data-v="door"><b>門</b><span>推開另有風光</span></button>
      <button data-v="unsure"><b>不能確定</b><span>兩者皆有可能</span></button>
    </div>
    <p class="msg" id="msg"></p>
  </section>
  <p class="foot" id="foot">連線中…</p>
</div>
<script>
(function(){
  var NODE='w08v', DB=null, ME='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  var foot=document.getElementById('foot'), msg=document.getElementById('msg'), box=document.getElementById('opts');
  function configured(){return window.FB_CONFIG&&FB_CONFIG.apiKey&&FB_CONFIG.apiKey.indexOf('PASTE')<0;}
  box.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button'); if(!b)return;
    if(!DB){msg.textContent='尚未連線，請稍候再按';return;}
    var v=b.getAttribute('data-v');
    msg.textContent='送出中…';
    // 等資料庫確認寫入成功才顯示「已投出」；同一頁再按一次＝改票
    DB.child(ME).set({v:v,t:Date.now()}).then(function(){
      [].forEach.call(box.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});
      msg.textContent='已投出：'+b.querySelector('b').textContent+'。想改票，直接按另一個選項。';
    }).catch(function(){msg.textContent='沒有送出成功，請再按一次';});
  });
  if(configured()&&typeof firebase!=='undefined'){
    try{
      firebase.initializeApp(window.FB_CONFIG);
      DB=firebase.database().ref('rooms/'+(window.FB_ROOM||'default')+'/'+NODE);
      foot.textContent='● 已連線——投票後投影幕即時更新';
    }catch(e){foot.textContent='⚠ 連線失敗：'+e.message+'（請確認網路後重新整理）';}
  }else{
    foot.textContent='⚠ 尚未設定連線，請通知老師';
  }
})();
</script>
</body>
</html>
